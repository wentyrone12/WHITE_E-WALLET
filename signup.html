<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHITE_E-WALLET signup</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
        }

        .container {
            width: 350px;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.15);
            color: #fff;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #00ff88;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid gray;
            outline: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
        }

        input:focus {
            border: 1px solid #00ff88;
            box-shadow: 0 0 4px 2px #00ff88;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #00ff88;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00cc6a;
            box-shadow: 0 0 4px 3px #00ff88;
        }

        .msg {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        a {
            color: #00ff88;
            text-decoration: none;
        }

        .link {
            text-align: center;
            margin-top: 12px;
        }

        .nametag {
            position: fixed;
            bottom: 30px;
            font-size: 10px;
            color: gray;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', sans-serif;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Create Account</h2>

        <input id="email" type="email" placeholder="Email">
        <input id="pin" type="password" placeholder="Create 5-digit PIN">
        <input id="password" type="password" placeholder="Password">
        <input id="confirmPassword" type="password" placeholder="Confirm Password">

        <button onclick="signup()">Sign Up</button>

        <p class="msg" id="msg"></p>

        <div class="link">
            Already have an account?<a href="index.html"> Login</a>
        </div>
    </div>

    <div class="nametag">Made by Wenxyz</div>

    <script>
        function signup() {
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let pin = document.getElementById("pin").value;
            let msg = document.getElementById("msg");

            let users = JSON.parse(localStorage.getItem("users")) || {};

            if (!email || !password || !confirmPassword || !pin) {
                msg.style.color = "red";
                msg.innerText = "Please fill in all fields";
                return;
            }

            if (users[email]) {
                msg.style.color = "red";
                msg.innerText = "Account already exists!";
                return;
            }

            if (password !== confirmPassword) {
                msg.style.color = "red";
                msg.innerText = "Passwords do not match!";
                return;
            }

            if (password.length < 6) {
                msg.style.color = "red";
                msg.innerText = "Password must be at least 6 characters";
                return;
            }

            if (pin.length !== 5) {
                msg.style.color = "red";
                msg.innerText = "PIN must be 5 digits";
                return;
            }

            // ✅ SAVE NA TALAGA
            users[email] = {
                password: password,
                pin: pin,
                balance: 0,
                transactions: []
            };

            localStorage.setItem("users", JSON.stringify(users));

            alert("Account created!");
            window.location.href = "index.html";
        }
    </script>

</body>

</html>
